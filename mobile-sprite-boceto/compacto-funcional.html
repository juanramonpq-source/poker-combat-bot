    function setStat(prefix, stats) {
      document.querySelector(`[data-${prefix}-attack]`).textContent = stats.attack;
      document.querySelector(`[data-${prefix}-defense]`).textContent = stats.defense;
      document.querySelector(`[data-${prefix}-armor]`).textContent = stats.armor;
      document.querySelector(`[data-${prefix}-attack-bar]`).style.setProperty("--w", `${Math.min(100, stats.attack * 8)}%`);
      document.querySelector(`[data-${prefix}-defense-bar]`).style.setProperty("--w", `${Math.min(100, stats.defense * 8)}%`);
      document.querySelector(`[data-${prefix}-armor-bar]`).style.setProperty("--w", `${Math.min(100, stats.armor * 8)}%`);
    }

    function getMechaPhaseImage(player) {
      if (!player || !player.core) return MECHA_IMAGES.base;
      const hasPilot = !!player.core.pilot;
      const hasCopilot = !!player.core.copilot;
      const hasBooster = !!player.core.booster;
      const hasAttack = player.attack?.length > 0;
      const hasDefense = player.defense?.length > 0;
      const hasArmor = player.armor?.length > 0;
      const hasFuel = player.fuel?.length > 0;
      const moduleCount = [hasBooster, hasAttack, hasDefense, hasArmor, hasFuel].filter(Boolean).length;
      const full = moduleCount >= 4 || (hasBooster && moduleCount >= 2);
      if (full && hasCopilot) return MECHA_IMAGES.completo;
      if (full && hasPilot) return MECHA_IMAGES.piloto_completo;
      if (full) return MECHA_IMAGES.base_booster;
      if (hasCopilot && hasBooster) return MECHA_IMAGES.booster;
      if (hasCopilot && hasFuel) return MECHA_IMAGES.combustible;
      if (hasCopilot && hasArmor) return MECHA_IMAGES.armadura;
      if (hasCopilot && hasDefense) return MECHA_IMAGES.defensa;
      if (hasCopilot && hasAttack) return MECHA_IMAGES.ataque;
      if (hasCopilot) return MECHA_IMAGES.copiloto;
      if (hasPilot && hasBooster) return MECHA_IMAGES.piloto_booster;
      if (hasPilot && hasFuel) return MECHA_IMAGES.piloto_combustible;
      if (hasPilot && hasArmor) return MECHA_IMAGES.piloto_armadura;
      if (hasPilot && hasDefense) return MECHA_IMAGES.piloto_defensa;
      if (hasPilot && hasAttack) return MECHA_IMAGES.piloto_ataque;
      if (hasPilot) return MECHA_IMAGES.piloto;
      if (hasBooster) return MECHA_IMAGES.base_booster;
      if (hasFuel) return MECHA_IMAGES.base_combustible;
      if (hasArmor) return MECHA_IMAGES.base_armadura;
      if (hasDefense) return MECHA_IMAGES.base_defensa;
      if (hasAttack) return MECHA_IMAGES.base_ataque;
      return MECHA_IMAGES.base;
    }

    function renderMechaBuild(player, index) {
      const node = document.querySelector(`[data-mecha-img="${index}"]`);
      if (!node || !player) return;
      const nextSrc = getMechaPhaseImage(player);
      const fighter = node.closest(".fighter");
      if (node.getAttribute("src") !== nextSrc) {
        node.setAttribute("src", nextSrc);
        node.classList.remove("is-evolving");
        void node.offsetWidth;
        node.classList.add("is-evolving");
        spawnSparksFromElement(node, index === 0 ? "cyan" : "red", 12);
      }
      const ready = playerCanAttack(player);
      node.classList.toggle("ready", ready);
      fighter?.classList.toggle("is-ready", ready);
      fighter?.classList.toggle("is-complete", isCompleteAttackMecha(player));
    }

    function renderMechas() {
      state.players.forEach((player, index) => renderMechaBuild(player, index));
    }

    function makeCardNode(card, context) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "card";
      button.draggable = context === "hand";
      button.title = cardText(card);
      if (context === "readonly") {
        button.disabled = true;
        button.classList.add("is-readonly");
      } else {
        button.dataset.cardId = card.id;
        if (state.selected.includes(card.id)) button.classList.add("is-selected");
      }
      const img = document.createElement("img");
      img.src = cardAsset(card);
      img.alt = cardText(card);
      button.appendChild(img);
      return button;
    }

    function normalizeHandOffset() {
      const handLength = state.players[0]?.hand?.length || 0;
      if (!handLength) {
        state.handOffset = 0;
        return 0;
      }
      state.handOffset = ((state.handOffset % handLength) + handLength) % handLength;
      return state.handOffset;
    }

    function orderedHandCards(player) {
      const hand = player?.hand || [];
      const offset = normalizeHandOffset();
      if (!offset) return hand;
      return hand.slice(offset).concat(hand.slice(0, offset));
    }

    function shiftHand(direction) {
      const player = state.players[0];
      if (!player || player.hand.length <= 1) return;
      state.handOffset += direction;
      normalizeHandOffset();
      const tray = document.querySelector("[data-hand-cards]");
      tray.classList.remove("is-shifting-left", "is-shifting-right");
      void tray.offsetWidth;
      tray.classList.add(direction > 0 ? "is-shifting-left" : "is-shifting-right");
      window.clearTimeout(handShiftTimer);
      handShiftTimer = window.setTimeout(() => {
        tray.classList.remove("is-shifting-left", "is-shifting-right");
      }, 220);
      renderHand();
    }

    function renderHand() {
      const player = state.players[0];
      const tray = document.querySelector("[data-hand-cards]");
      tray.innerHTML = "";
      orderedHandCards(player).forEach((card) => tray.appendChild(makeCardNode(card, "hand")));
      document.querySelector("[data-hand-count]").textContent = `${player.hand.length}/${MAX_HAND_SIZE}`;
      document.querySelectorAll("[data-hand-shift]").forEach((button) => {
        button.disabled = player.hand.length <= 1;
      });
    }

    function fillZoneCards(container, cards, emptyText = "Arrastra aqui", context = "zone") {
      container.innerHTML = "";
      if (cards.length) {
        cards.forEach((card) => container.appendChild(makeCardNode(card, context)));
      } else {
        container.innerHTML = `<div class="empty-zone">${emptyText}</div>`;
      }
    }

    function makeDropZone(zone, title, cards, meta, className = "") {
      const node = document.createElement("article");
      node.className = `drop-zone ${className}`.trim();
      node.dataset.zone = zone;
      node.innerHTML = `<header class="zone-title"><span>${title}</span><b>${meta}</b></header><div class="zone-cards"></div>`;
      fillZoneCards(node.querySelector(".zone-cards"), cards);
      return node;
    }

    function makePanelZone(title, cards, meta, className = "", emptyText = "Sin cartas") {
      const node = document.createElement("article");
      node.className = `panel-zone ${className}`.trim();
      node.innerHTML = `<header class="zone-title"><span>${title}</span><b>${meta}</b></header><div class="zone-cards"></div>`;
      fillZoneCards(node.querySelector(".zone-cards"), cards, emptyText, "readonly");
      return node;
    }

    function makeCoreSlot(zone, title, card, meta, readonly = false) {
      const node = document.createElement("section");
      node.className = readonly ? "core-slot panel-zone" : "core-slot drop-zone";
      if (!readonly) node.dataset.zone = zone;
      node.innerHTML = `<header class="zone-title"><span>${title}</span><b>${meta}</b></header><div class="zone-cards"></div>`;
      fillZoneCards(node.querySelector(".zone-cards"), card ? [card] : [], "Vacio", readonly ? "readonly" : "zone");
      return node;
    }

    function renderBoard() {
      const isRivalView = state.activeTab === "rival" && !state.attackMode;
      const player = isRivalView ? state.players[1] : state.players[0];
      const grid = document.querySelector("[data-zone-grid]");
      shell.classList.toggle("rival-view", isRivalView);
      grid.classList.toggle("is-rival", isRivalView);
      grid.innerHTML = "";

      const core = document.createElement("article");
      core.className = "panel-zone core-panel";
      core.innerHTML = '<header class="zone-title"><span>Nucleo</span><b>Piloto / Copiloto / Boost</b></header><div class="core-slots"></div>';
      const coreSlots = core.querySelector(".core-slots");
      coreSlots.append(
        makeCoreSlot("pilot", "Piloto", player.core.pilot, "J/Q/K", isRivalView),
        makeCoreSlot("copilot", "Copiloto", player.core.copilot, "J/Q/K", isRivalView),
        makeCoreSlot("booster", "Boost", player.core.booster, "A", isRivalView)
      );

      const attackZone = isRivalView
        ? makePanelZone("Ataque rival (Picas)", player.attack, `${player.attack.length}/${moduleLimit(player, "attack")} max`, "zone-attack")
        : makeDropZone("attack", "Ataque (Picas)", player.attack, `${player.attack.length}/${moduleLimit(player, "attack")} max`, "zone-attack");
      const defenseZone = isRivalView
        ? makePanelZone("Defensa rival (Corazones)", player.defense, `${player.defense.length}/${moduleLimit(player, "defense")} max`, "zone-defense")
        : makeDropZone("defense", "Defensa (Corazones)", player.defense, `${player.defense.length}/${moduleLimit(player, "defense")} max`, "zone-defense");
      const armorZone = isRivalView
        ? makePanelZone("Armadura rival (Treboles)", player.armor, `${player.armor.length}/${moduleLimit(player, "armor")} max`, "zone-armor")
        : makeDropZone("armor", "Armadura (Treboles)", player.armor, `${player.armor.length}/${moduleLimit(player, "armor")} max`, "zone-armor");
      const fuelZone = isRivalView
        ? makePanelZone("Combustible rival (Fuel)", player.fuel, "sin limite", "zone-fuel")
        : makeDropZone("fuel", "Combustible (Fuel)", player.fuel, "sin limite", "zone-fuel");

      const reg = document.createElement("article");

      reg.innerHTML = `<header class="zone-title"><span>REG</span><b>${state.log.length}</b></header><div class="zone-cards"><div class="empty-zone">${state.log.slice(0, 6).join("<br>") || "Sin eventos"}</div></div>`;

      grid.append(core, attackZone, defenseZone, armorZone);
      if (!isRivalView) grid.append(reg);
      grid.append(fuelZone);

      const title = document.querySelector("[data-drawer-title]");
      const subtitle = document.querySelector("[data-drawer-subtitle]");
      if (state.attackMode) {

        subtitle.textContent = "Toca fuel y picas. El ataque principal no puede superar fuel x2.";
      } else if (isRivalView) {
        title.textContent = "Panel del rival";
        subtitle.textContent = "Cartas visibles del rival. La mano permanece oculta.";
      } else {
        title.textContent = "Paneles de montaje";
        subtitle.textContent = `Operaciones: ${state.pendingBuildOps}/${buildOpsLimit()}. Arrastra cartas de la mano al destino.`;
      }
    }

    function renderMessages() {
      const tutorial = document.querySelector("[data-tutorial-message]");
      const tutorialText = document.querySelector("[data-tutorial-text]");
      tutorial.classList.toggle("show", state.tutorial);
      if (state.pendingDefense) {
        const defender = state.players[state.pendingDefense.defenderIndex];
        const diamonds = defender.hand.filter(isNumericDiamond);
        tutorialText.textContent = "Usa Acciones para jugar. MECHA abre tu montaje y RIVAL muestra sus cartas visibles.";

        document.querySelector("[data-alert-text]").textContent = state.pendingDefense.defenderIndex === 0
          ? (diamonds.length
            ? `${defender.name} puede reducir ${state.pendingDefense.totalAttack} punto(s) usando 1♦ numerico.`
            : `${defender.name} no tiene 1♦ numerico disponible.`)

            : "CPU no tiene diamantes numericos y recibira el ataque.");

        else if (state.phase === "Turno rival") tutorialText.textContent = "El rival actua en el panel central. Si ataca, la alerta aparece aqui debajo.";
        else tutorialText.textContent = "Arrastra cartas al panel de montaje. El boton amarillo Acciones abre todas las jugadas.";

    function renderActions() {
      document.querySelectorAll(".tab-sprite").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.tab === state.activeTab);
      });
      document.querySelector("[data-board-toggle]").classList.toggle("is-active", shell.classList.contains("board-open"));
      document.querySelector('[data-action="attack-mode"]').classList.toggle("is-active", state.attackMode);
      document.querySelector('[data-action="projectile"]').classList.toggle("is-active", state.projectileMode);
      document.querySelector("[data-action-toggle]")?.setAttribute("aria-expanded", shell.classList.contains("actions-open") ? "true" : "false");
      syncActionFlyouts();
      const playerTurn = state.currentPlayer === 0 && !state.pendingDefense && !state.winner;
      const defenseTurn = !!state.pendingDefense && state.pendingDefense.defenderIndex === 0;
      const player = state.players[0];
      const attackReady = playerTurn && player && playerCanAttack(player);
      const actionStates = {
        modify: playerTurn,
        draw: playerTurn,
        "attack-mode": attackReady,
        projectile: playerTurn && state.attackMode && state.projectileUnlocked,
        confirm: (playerTurn && state.attackMode) || defenseTurn,
        pass: playerTurn || defenseTurn,
        defend: defenseTurn,
        "skip-defense": defenseTurn,
        clear: playerTurn || defenseTurn
      };
      Object.entries(actionStates).forEach(([action, enabled]) => {
        document.querySelectorAll(`[data-action="${action}"]`).forEach((button) => {
          button.disabled = !enabled;
        });
      });
      syncAttackReadiness();
    }

    function render() {
      renderStats();
      renderMechas();
      renderHand();
      renderBoard();
      renderMessages();
      renderActions();
    }

    function clearPressedButtons() {
      document.querySelectorAll("button.is-pressing").forEach((button) => button.classList.remove("is-pressing"));
    }

    document.addEventListener("pointerdown", (event) => {
      const button = event.target.closest("button");
      if (!button || button.disabled) return;
      button.classList.add("is-pressing");
    }, { passive: true });

    document.addEventListener("pointerup", clearPressedButtons, { passive: true });
    document.addEventListener("pointercancel", clearPressedButtons, { passive: true });
    document.addEventListener("pointerleave", (event) => {
      const button = event.target.closest?.("button");
      if (button) button.classList.remove("is-pressing");
    }, true);
    document.addEventListener("blur", clearPressedButtons, true);

    document.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      const zone = event.target.closest(".drop-zone");
      if (!button && zone && zone.dataset.zone !== "reg") {
        const selectedHand = state.selected.map((id) => findCard(id)).find((item) => item && item.player === state.players[0] && item.zone === "hand");
        if (selectedHand) placeCard(selectedHand.card.id, zone.dataset.zone);
        return;
      }
      if (!button) {
        if (!event.target.closest(".top-menu")) {
          shell.classList.remove("menu-open");
          document.querySelector("[data-menu-toggle]")?.setAttribute("aria-expanded", "false");
        }
        if (!event.target.closest(".action-hub")) closeActions();
        return;
      }
      if (button.dataset.menuToggle !== undefined) {
        shell.classList.toggle("menu-open");
        button.setAttribute("aria-expanded", shell.classList.contains("menu-open") ? "true" : "false");
        return;
      }
      if (button.dataset.handShift) {
        shiftHand(Number(button.dataset.handShift));
        return;
      }
      if (button.dataset.menu) {
        handleMenu(button.dataset.menu);
        shell.classList.remove("menu-open");
        document.querySelector("[data-menu-toggle]")?.setAttribute("aria-expanded", "false");
      }
      if (button.dataset.actionToggle !== undefined) openActions();
      if (button.dataset.boardToggle !== undefined) {
        shell.classList.toggle("board-open");
        state.activeTab = state.activeTab === "rival" ? "rival" : "mecha";
        render();
      }
      if (button.dataset.boardClose !== undefined) closeBoard();
      if (button.dataset.applyBuild !== undefined) applyBuildChanges();
      if (button.dataset.tab) openBoard(button.dataset.tab);
      if (button.dataset.action) handleAction(button.dataset.action);
      if (button.dataset.cardId) toggleSelected(button.dataset.cardId);
      if (button.dataset.defenseAction === "confirm") confirmDefense();
      if (button.dataset.defenseAction === "skip") skipDefense();
    });

    document.addEventListener("dragstart", (event) => {
      const card = event.target.closest(".card");
      if (!card || !card.draggable) return;
      const found = findCard(card.dataset.cardId);
      if (!canHintBuildTargets(found)) {
        event.preventDefault();
        toast(state.pendingBuildOps >= buildOpsLimit() ? "Limite de modificacion alcanzado." : "Ahora no puedes montar cartas.");
        return;
      }
      draggedCardId = card.dataset.cardId;
      event.dataTransfer.setData("text/plain", draggedCardId);
      event.dataTransfer.effectAllowed = "move";
      updateDropHints(draggedCardId);
    });

    document.addEventListener("dragover", (event) => {
      const zone = event.target.closest(".drop-zone");
      if (!zone || zone.dataset.zone === "reg" || !draggedCardId) return;
      updateDropHover(zone);
      if (!zone.classList.contains("is-drop-valid")) {
        event.dataTransfer.dropEffect = "none";
        return;
      }
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
    });

    document.addEventListener("dragleave", (event) => {
      const zone = event.target.closest(".drop-zone");
      if (zone) zone.classList.remove("is-drop-hover");
    });

    document.addEventListener("drop", (event) => {
      const zone = event.target.closest(".drop-zone");
      if (!zone) {
        clearDropHints();
        draggedCardId = null;
        return;
      }
      event.preventDefault();
      if (zone.dataset.zone === "reg") {
        clearDropHints();
        draggedCardId = null;
        return;
      }
      if (!zone.classList.contains("is-drop-valid")) {
        clearDropHints();
        draggedCardId = null;
        return;
      }
      const cardId = event.dataTransfer.getData("text/plain") || draggedCardId;
      clearDropHints();
      draggedCardId = null;
      placeCard(cardId, zone.dataset.zone);
    });

    document.addEventListener("dragend", () => {
      clearDropHints();
      draggedCardId = null;
    });

    seedDemoGame();
  </script>
</body>
</html>
