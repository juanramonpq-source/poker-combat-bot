<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoCoBOT · Boceto compacto funcional</title>
  <meta name="description" content="Boceto compacto funcional con paneles desplegables para PoCoBOT.">
  <style>
    :root {
      color-scheme: dark;
      --blue-0: #0b6dbe;
      --blue-1: #064d8f;
      --blue-2: #032b56;
      --blue-3: #06172a;
      --cream-0: #fff1cf;
      --cream-1: #d5b77f;
      --cream-2: #845d2f;
      --cyan: #46ecff;
      --red: #ff533d;
      --gold: #ffc42f;
      --green: #41ff59;
      --ink: #061525;
      --shadow: 0 28px 70px rgba(0, 0, 0, .62);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 10px;
      background:
        radial-gradient(circle at 50% 8%, rgba(41, 128, 255, .24), transparent 30%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 8px),
        linear-gradient(180deg, #05090e, #020306);
      font-family: "Arial Narrow", "Avenir Next Condensed", "Impact", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button {
      appearance: none;
      border: 0;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      transition:
        translate .09s ease,
        filter .12s ease,
        box-shadow .12s ease,
        opacity .12s ease,
        transform .16s ease;
    }

    button:disabled {
      cursor: default;
    }

    button:not(:disabled):focus-visible {
      outline: 3px solid rgba(255, 242, 189, .86);
      outline-offset: 2px;
    }

    button:not(:disabled):active,
    button.is-pressing {
      translate: 0 2px;
      filter: brightness(.95) saturate(1.08);
    }

    .phone-shell {
      position: relative;
      width: min(430px, calc(100vw - 12px));
      min-height: 844px;
      padding: 10px 12px 11px;
      border: 5px solid #03274f;
      border-radius: 32px;
      overflow: hidden;
      color: #f7fbff;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, .26), transparent 10%),
        radial-gradient(circle at 80% 0%, rgba(255, 255, 255, .18), transparent 12%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .045) 0 1px, transparent 1px 7px),
        linear-gradient(180deg, #0868bb 0%, var(--blue-0) 34%, var(--blue-2) 100%);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, .34),
        inset 0 -8px 0 rgba(0, 20, 52, .46),
        inset 0 0 0 2px rgba(77, 168, 255, .35),
        var(--shadow);
    }

    .phone-shell::before,
    .phone-shell::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .phone-shell::before {
      inset: 8px;
      border: 2px solid rgba(1, 28, 64, .7);
      border-radius: 24px;
      box-shadow: inset 0 0 0 1px rgba(116, 198, 255, .24);
    }

    .phone-shell::after {
      inset: 0;
      opacity: .14;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, .8) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(0, 0, 0, .8) 0 1px, transparent 1.6px);
      background-size: 31px 37px, 43px 47px;
      mix-blend-mode: soft-light;
    }

    .top-vents {
      position: absolute;
      top: 20px;
      display: grid;
      gap: 5px;
      z-index: 1;
    }

    .top-vents span {
      display: block;
      height: 5px;
      border-radius: 99px;
      background: #020b14;
      box-shadow: inset 0 2px 0 rgba(82, 183, 255, .38);
    }

    .vents-left {
      left: 29px;
      width: 39px;
    }

    .vents-right {
      right: 32px;
      grid-template-columns: repeat(3, 7px);
      gap: 6px;
    }

    .vents-right span {
      width: 7px;
      height: 7px;
    }

    .brand-plate {
      position: relative;
      z-index: 2;
      width: min(266px, 72vw);
      height: 56px;
      margin: 0 auto 5px;
      padding: 0;
      border-radius: 19px;
      border: 4px solid #052d5c;
      background:
        linear-gradient(135deg, transparent 0 18px, rgba(255, 255, 255, .2) 19px 22px, transparent 23px),
        radial-gradient(circle at 50% 0, rgba(100, 219, 255, .24), transparent 62%),
        linear-gradient(180deg, #0b65b4, #073d79 58%, #041f43);
      box-shadow:
        inset 0 2px 0 rgba(146, 221, 255, .42),
        inset 0 -4px 0 rgba(2, 16, 34, .45),
        0 6px 0 rgba(1, 35, 78, .75);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .top-menu-toggle {
      position: absolute;
      z-index: 28;
      top: 16px;
      right: 18px;
      min-width: 58px;
      min-height: 32px;
      padding: 4px 9px;
      border: 3px solid #5d3900;
      border-radius: 999px;
      color: #211301;
      background:
        linear-gradient(135deg, rgba(255,255,255,.5), transparent 36%),
        linear-gradient(180deg, #fff28a, #ffc42f 62%, #b86600);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.68),
        inset 0 -3px 0 rgba(116,62,0,.35),
        0 4px 0 #4b2a00;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .brand-plate img {
      display: block;
      position: absolute;
      left: 50%;
      top: -43px;
      width: min(294px, calc(100% + 42px));
      max-width: none;
      height: auto;
      transform: translateX(-50%);
      filter: drop-shadow(0 3px 0 rgba(0, 10, 25, .48)) drop-shadow(0 0 12px rgba(91, 219, 255, .18));
    }

    .screw {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #fff6d4, #9d7b4a 45%, #2d2015 72%);
      box-shadow: 0 1px 0 rgba(0, 0, 0, .35);
    }

    .screw-tl { top: 7px; left: 8px; }
    .screw-tr { top: 7px; right: 8px; }
    .screw-bl { bottom: 7px; left: 8px; }
    .screw-br { bottom: 7px; right: 8px; }

    .top-menu {
      position: absolute;
      z-index: 27;
      left: 12px;
      right: 12px;
      top: 72px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      margin: 0;
      padding: 6px;
      border: 3px solid #704d25;
      border-radius: 14px;
      background:
        repeating-linear-gradient(135deg, rgba(114, 78, 33, .08) 0 1px, transparent 1px 8px),
        linear-gradient(180deg, var(--cream-0), var(--cream-1));
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, .7), 0 5px 0 rgba(0, 22, 48, .72);
      opacity: 0;
      transform: translateY(-8px) scale(.98);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .phone-shell.menu-open .top-menu {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu-button {
      min-height: 26px;
      padding: 3px 5px;
      border: 2px solid #052044;
      border-radius: 9px;
      color: #062033;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .42), transparent 36%),
        linear-gradient(180deg, #9fd0ff, #4f8fd6 64%, #235a97);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, .42), inset 0 -3px 0 rgba(0, 35, 73, .32), 0 3px 0 #173558;
      font-size: 12px;
      line-height: 1.02;
      font-weight: 900;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .menu-button.danger {
      color: #ffe8bf;
      border-color: #6c170f;
      background: linear-gradient(180deg, #ff684c, #c92317 64%, #82140e);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.28), 0 3px 0 #4f0b07;
    }

    .menu-button.on {
      background: linear-gradient(180deg, #fff3a7, #ffc42f 66%, #c27600);
      color: #231606;
    }

    .status-strip {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }

    .meter-pill {
      min-height: 40px;
      display: grid;
      grid-template-columns: 21px minmax(0, auto) 36px;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border: 3px solid #06172a;
      border-radius: 11px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .12), transparent 42%),
        linear-gradient(180deg, #10283d, #061421);
      box-shadow: inset 0 0 0 2px rgba(83, 233, 255, .12), 0 4px 0 rgba(0, 14, 30, .72);
      overflow: hidden;
    }

    .meter-pill small {
      display: block;
      color: #ffe8c4;
      font-size: 12px;
      line-height: 1;
    }

    .meter-pill strong {
      display: block;
      color: var(--cyan);
      font-size: 21px;
      line-height: .95;
      text-shadow: 0 0 12px rgba(70, 236, 255, .65);
    }

    .fuel-icon {
      width: 18px;
      height: 27px;
      border: 3px solid #e9cfa5;
      border-radius: 5px 5px 3px 3px;
      position: relative;
    }

    .fuel-icon::before,
    .fuel-icon::after {
      content: "";
      position: absolute;
      border: 3px solid #e9cfa5;
    }

    .fuel-icon::before {
      left: 4px;
      top: -10px;
      width: 11px;
      height: 9px;
      border-bottom: 0;
    }

    .fuel-icon::after {
      right: -10px;
      top: 8px;
      width: 9px;
      height: 15px;
      border-left: 0;
      border-radius: 0 6px 6px 0;
    }

    .core-ring {
      width: 25px;
      height: 25px;
      border: 6px solid #dcc394;
      border-radius: 50%;
      box-shadow: inset 0 0 0 3px #5b4629;
    }

    .mini-bars {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      height: 22px;
    }

    .mini-bars b {
      border-radius: 2px;
      background: linear-gradient(180deg, #8fffff, #0fb1ce);
      box-shadow: 0 0 8px rgba(70, 236, 255, .55);
    }

    .mini-bars.is-muted b {
      background: linear-gradient(180deg, #1d394a, #07131d);
      box-shadow: none;
    }

    .led-trigger {
      width: 60px;
      height: 32px;
      display: grid;
      grid-template-columns: repeat(3, 12px);
      justify-content: center;
      align-content: center;
      gap: 5px;
      border: 3px solid #06172a;
      border-radius: 14px;
      background: linear-gradient(180deg, #36404a, #11171d);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.12), 0 4px 0 rgba(0, 14, 30, .76);
      cursor: default;
    }

    .led-trigger i,
    .leds i,
    .hand-tray footer i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #101316;
      border: 2px solid #050607;
    }

    .led-trigger .on,
    .leds .on,
    .hand-tray footer .on {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .combat-screen {
      position: relative;
      z-index: 2;
      min-height: 344px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
      border: 4px solid #051728;
      border-radius: 18px;
      background: linear-gradient(90deg, rgba(0, 188, 255, .18), rgba(255, 68, 44, .18)), #05101c;
      box-shadow:
        inset 0 0 0 2px rgba(48, 236, 255, .12),
        inset 0 -18px 40px rgba(0, 0, 0, .5),
        0 7px 0 rgba(0, 18, 40, .78);
    }

    .scan-grid {
      position: absolute;
      inset: 0;
      opacity: .4;
      background:
        linear-gradient(rgba(70, 236, 255, .14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(70, 236, 255, .14) 1px, transparent 1px);
      background-size: 21px 21px;
      animation: scanDrift 9s linear infinite;
    }

    .combat-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .36;
      background:
        linear-gradient(105deg, transparent 0 34%, rgba(255,255,255,.1) 43%, transparent 52%),
        radial-gradient(circle at 50% 0%, rgba(255, 196, 47, .13), transparent 40%);
      mix-blend-mode: screen;
      animation: panelSweep 5.8s ease-in-out infinite;
    }

    .combat-attack-layer {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      overflow: hidden;
    }

    .combat-attack-beam,
    .combat-attack-impact,
    .combat-attack-wave,
    .combat-attack-label {
      position: absolute;
      opacity: 0;
    }

    .combat-attack-beam {
      top: 51%;
      left: 50%;
      width: 78%;
      height: 15px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background:
        linear-gradient(90deg, transparent, rgba(255,249,201,.96) 13%, rgba(255,137,72,.98) 42%, #fff 50%, rgba(255,118,68,.96) 63%, transparent);
      box-shadow: 0 0 18px rgba(255,182,92,.55), 0 0 34px rgba(35,216,255,.26);
      filter: drop-shadow(0 0 18px rgba(255,163,77,.26));
    }

    .combat-attack-impact,
    .combat-attack-wave {
      width: 112px;
      height: 112px;
      top: 51%;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.28);
    }

    .combat-attack-impact {
      background: radial-gradient(circle, #fff 0 12%, rgba(255,214,97,.94) 20%, rgba(255,117,84,.86) 44%, transparent 74%);
      box-shadow: 0 0 26px rgba(255,170,66,.34);
    }

    .combat-attack-wave {
      border: 4px solid rgba(255,224,128,.68);
      box-shadow: 0 0 28px rgba(35,216,255,.22);
    }

    .combat-attack-label {
      left: 50%;
      top: 22%;
      transform: translate(-50%, 0);
      padding: 7px 16px;
      border-radius: 999px;
      border: 2px solid rgba(255,242,196,.8);
      background: linear-gradient(180deg, rgba(17,34,80,.92), rgba(28,64,141,.96));
      color: #fff5cf;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      box-shadow: 0 0 0 3px rgba(35,216,255,.12), 0 12px 24px rgba(8,16,42,.28);
    }

    .combat-attack-layer.from-left .combat-attack-impact,
    .combat-attack-layer.from-left .combat-attack-wave { left: 76%; }

    .combat-attack-layer.from-right .combat-attack-impact,
    .combat-attack-layer.from-right .combat-attack-wave { left: 24%; }

    .combat-attack-layer.with-projectile .combat-attack-beam {
      height: 10px;
      background:
        linear-gradient(90deg, transparent, rgba(226,252,255,.98) 18%, rgba(101,231,255,.98) 48%, #fff 56%, transparent);
      box-shadow: 0 0 18px rgba(88,216,239,.68), 0 0 40px rgba(88,216,239,.38);
    }

    .combat-attack-layer.active .combat-attack-label { animation: attackLabelRise 1120ms ease both; }
    .combat-attack-layer.from-left.active .combat-attack-beam { animation: attackBeamLeft 760ms cubic-bezier(.18,.7,.12,1) both; }
    .combat-attack-layer.from-right.active .combat-attack-beam { animation: attackBeamRight 760ms cubic-bezier(.18,.7,.12,1) both; }
    .combat-attack-layer.active .combat-attack-impact { animation: attackImpactFlash 720ms ease-out both; }
    .combat-attack-layer.active .combat-attack-wave { animation: attackWavePulse 780ms ease-out both; }

    .split-light {
      position: absolute;
      inset: -20% 49% -20% auto;
      width: 3px;
      transform: rotate(16deg);
      background: linear-gradient(180deg, transparent, #31e7ff, #ff513d, transparent);
      box-shadow: 0 0 18px #ff533d;
    }

    .versus {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 45%;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      border: 2px solid rgba(70, 236, 255, .6);
      border-radius: 50%;
      color: #e9fbff;
      font-size: 27px;
      font-weight: 900;
      text-shadow: 0 0 14px #46ecff, 0 0 16px #ff533d;
      background: radial-gradient(circle, rgba(1, 23, 38, .78), rgba(1, 11, 21, .1));
    }

    .fighter {
      position: relative;
      min-width: 0;
      padding: 10px 7px 8px;
      animation: fighterBreath 5.2s ease-in-out infinite;
      will-change: transform, filter;
    }

    .fighter-blue {
      grid-column: 1;
      grid-row: 1;
    }

    .fighter-red {
      grid-column: 2;
      grid-row: 1;
    }

    .fighter header {
      position: relative;
      z-index: 2;
      width: 127px;
      padding: 6px 10px;
      border: 2px solid currentColor;
      color: var(--cyan);
      background: rgba(0, 19, 35, .76);
      clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
      font-size: 15px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fighter.is-ready header {
      animation: readyHeaderPulse 1.8s ease-in-out infinite;
    }

    .fighter-red header {
      margin-left: auto;
      color: var(--red);
      text-align: right;
      clip-path: polygon(10% 0, 100% 0, 100% 100%, 10% 100%, 0 50%);
    }

    .mecha-blueprint-live {
      --mecha-tilt: -4deg;
      position: relative;
      z-index: 1;
      width: 190px;
      height: 218px;
      margin: -1px 0 -14px -28px;
      transform: rotate(var(--mecha-tilt)) translateX(3px);
      filter: drop-shadow(0 14px 14px rgba(0, 0, 0, .62)) saturate(1.12);
      pointer-events: none;
    }

    .fighter-red .mecha-blueprint-live {
      --mecha-tilt: 4deg;
      margin-left: -18px;
      transform: scaleX(-1) rotate(var(--mecha-tilt)) translateX(3px);
      filter: hue-rotate(143deg) saturate(1.32) drop-shadow(0 14px 14px rgba(0, 0, 0, .62));
    }

    .mecha-blueprint-live::before {
      content: "";
      position: absolute;
      inset: 22px 36px 18px;
      border-radius: 28px;
      background:
        linear-gradient(rgba(70, 236, 255, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(70, 236, 255, .06) 1px, transparent 1px);
      background-size: 9px 9px;
      box-shadow: inset 0 0 20px rgba(70, 236, 255, .08);
      opacity: .62;
    }

    .mecha-layer {
      position: absolute;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0;
      transform: translateY(9px) scale(.94);
      transform-origin: center;
      transition: opacity .24s ease, transform .24s ease, filter .24s ease;
      filter: drop-shadow(0 0 8px rgba(70, 236, 255, .16));
    }

    .mecha-layer.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .mecha-layer.base {
      background-image: url("../assets/image_01.png");
      left: 22%;
      top: 12%;
      width: 56%;
      height: 82%;
      opacity: .98;
      transform: none;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, .12));
    }

    .mecha-layer.cockpit {
      background-image: url("../assets/image_02.png");
      left: 17%;
      top: 7%;
      width: 68%;
      height: 48%;
    }

    .mecha-layer.torso {
      background-image: url("../assets/image_03.png");
      left: 23%;
      top: 18%;
      width: 56%;
      height: 58%;
    }

    .mecha-layer.left-arm {
      background-image: url("../assets/image_04.png");
      left: 0;
      top: 30%;
      width: 42%;
      height: 58%;
    }

    .mecha-layer.right-weapon {
      background-image: url("../assets/image_05.png");
      left: 29%;
      top: 34%;
      width: 74%;
      height: 44%;
    }

    .mecha-layer.armor {
      background-image: url("../assets/image_06.png");
      left: 17%;
      top: 20%;
      width: 66%;
      height: 62%;
    }

    .mecha-layer.support {
      background-image: url("../assets/image_07.png");
      left: 32%;
      top: 31%;
      width: 40%;
      height: 30%;
      filter: drop-shadow(0 0 10px rgba(255, 196, 47, .18));
    }

    .mecha-layer.complete {
      background-image: url("../assets/image_08.png");
      left: 8%;
      top: 3%;
      width: 84%;
      height: 92%;
      filter: drop-shadow(0 0 14px rgba(70, 236, 255, .25));
    }

    .mecha-blueprint-live.ready .mecha-layer.complete.active {
      filter: drop-shadow(0 0 18px rgba(66, 255, 222, .32));
    }

    .mecha-phase-live {
      position: relative;
      z-index: 1;
      display: block;
      width: 150px;
      height: 174px;
      max-width: none;
      object-fit: contain;
      object-position: center bottom;
      margin: -3px 0 -10px -17px;
      filter: drop-shadow(0 15px 15px rgba(0, 0, 0, .62)) saturate(1.08);
      pointer-events: none;
      transition: filter .2s ease, opacity .2s ease;
    }

    .fighter-blue .mecha-phase-live {
      transform: scaleX(-1) rotate(-4deg) translateX(-3px);
      animation: mechaIdleBlue 4.8s ease-in-out infinite;
    }

    .fighter-red .mecha-phase-live {
      margin-left: -3px;
      transform: rotate(4deg) translateX(4px);
      animation: mechaIdleRed 4.8s ease-in-out infinite;
      animation-delay: .65s;
    }

    .mecha-phase-live.ready {
      filter: drop-shadow(0 15px 15px rgba(0, 0, 0, .62)) drop-shadow(0 0 15px rgba(66, 255, 222, .28)) saturate(1.12);
    }

    .fighter-blue .mecha-phase-live.ready {
      animation: mechaReadyBlue 2.1s ease-in-out infinite;
    }

    .fighter-red .mecha-phase-live.ready {

      left: 22px;
      right: 22px;
      bottom: 24px;
      display: none;
      padding: 10px 12px;
      border-radius: 13px;
      border: 2px solid rgba(255,242,189,.82);

      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.25;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0,0,0,.38);
      overflow-wrap: anywhere;
    }

    .toast.show {
      display: block;
      animation: messageIn .18s ease both;
    }

    .fx-layer {
      position: absolute;
      inset: 0;
      z-index: 70;
      pointer-events: none;
      overflow: hidden;
    }

    .fx-spark {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size, 7px);
      height: var(--size, 7px);
      border-radius: 50%;
      color: var(--spark-color, #fff6a8);
      background: currentColor;
      box-shadow: 0 0 11px currentColor;
      transform: translate(-50%, -50%);
      animation: sparkFly var(--dur, .72s) ease-out both;
    }

    .fx-spark::after {
      content: "";
      position: absolute;
      inset: 35% -130%;
      border-radius: 999px;
      background: currentColor;
      opacity: .55;
    }

    .damage-pop {
      position: absolute;
      z-index: 72;
      min-width: 54px;
      padding: 7px 11px;
      border-radius: 999px;

      font-family: "Courier New", monospace;
      font-size: 15px;
      font-weight: 1000;
      text-align: center;
      box-shadow: 0 10px 18px rgba(91,25,0,.3), 0 0 22px rgba(255,132,70,.42);
      transform: translate(-50%, -50%);
      animation: damagePop .98s ease both;
      pointer-events: none;
    }

    .attack-special-popup-overlay {
      position: absolute;
      left: 50%;
      top: 38%;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.86);
      filter: drop-shadow(0 0 18px rgba(255,180,62,.26));
      transition: opacity .16s ease, visibility .16s ease, transform .16s ease;
    }

    .attack-special-popup-overlay.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .attack-special-popup-shell {
      position: relative;
      width: clamp(150px, 48vw, 218px);
      padding: 7px 7px 8px;
      border-radius: 14px;
      border: 1px solid rgba(255,214,110,.55);
      background:
        linear-gradient(90deg, rgba(255,221,92,.18), transparent 18%, transparent 82%, rgba(96,225,255,.14)),
        radial-gradient(circle at 50% 0%, rgba(255,186,71,.18), transparent 48%),
        linear-gradient(180deg, rgba(16,33,58,.88), rgba(5,11,20,.94));
      box-shadow:
        0 0 0 1px rgba(146,245,255,.1),
        inset 0 0 0 1px rgba(255,255,255,.06),
        inset 0 -10px 18px rgba(0,0,0,.3),
        0 12px 28px rgba(0,0,0,.38),
        0 0 24px rgba(255,152,64,.22);
      backdrop-filter: blur(6px);
      transform-origin: center;

    .attack-special-popup-overlay.show .attack-special-popup-shell {
      animation: attackMonitorPowerOn .48s cubic-bezier(.2, .78, .2, 1.08) both;

    .attack-special-popup-shell::before,
    .attack-special-popup-shell::after {
      content: "";
      position: absolute;
      top: 18px;
      bottom: 14px;
      width: 3px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,213,95,.78), rgba(72,220,255,.18));

    .attack-special-popup-shell::before { left: -5px; }
    .attack-special-popup-shell::after { right: -5px; }

    .attack-special-monitor-head {

      gap: 6px;
      min-height: 18px;
      padding: 0 2px 5px;

      box-shadow: 0 0 6px rgba(143,244,255,.28);

    .attack-special-monitor-bars span:nth-child(2) { height: 9px; }
    .attack-special-monitor-bars span:nth-child(3) { height: 7px; }

    .attack-special-popup-frame {

      overflow: hidden;
      border-radius: 9px;
      border: 1px solid rgba(150,245,255,.32);
      background:
        radial-gradient(circle at 50% 18%, rgba(143,244,255,.1), transparent 42%),

        inset 0 0 0 1px rgba(255,255,255,.05),
        inset 0 0 16px rgba(72,214,255,.1);

    .attack-special-popup-overlay.show .attack-special-popup-frame {
      animation: attackMonitorTubeBloom .56s cubic-bezier(.18, .82, .22, 1) both;
    }

    .attack-special-popup-frame::before {
      content: "";

      z-index: 1;

    .attack-special-popup-video {

    .attack-special-monitor-foot {

      gap: 4px;
      padding-top: 6px;
    }

    .attack-special-monitor-foot span {
      width: 14px;
      height: 3px;

    }

    .attack-special-monitor-foot span:nth-child(2) {

    @keyframes attackBeamRight {

      18%, 68% { opacity: 1; }

    @keyframes attackImpactFlash {

      22% { opacity: .96; }

    }

    @keyframes attackWavePulse {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
      24% { opacity: .8; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.42); }

        position: fixed;
        inset: 0;
        padding: 0;
        align-items: start;

  </style>
</head>
<body>
  <main class="phone-shell" aria-label="Boceto compacto funcional de PoCoBOT">
    <div class="top-vents vents-left" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="top-vents vents-right" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>

    <section class="brand-plate">

          <p><span class="suit-mark">♥</span><b>Defensa</b><strong data-p1-defense>0</strong><i data-p1-defense-bar style="--w:0%"></i></p>
          <p><span class="suit-mark">♣</span><b>Armadura</b><strong data-p1-armor>0</strong><i data-p1-armor-bar style="--w:0%"></i></p>

          <p><span class="suit-mark">♠</span><b>Ataque</b><strong data-p2-attack>0</strong><i data-p2-attack-bar style="--w:0%"></i></p>

        <button class="actions-button" type="button" data-action-toggle aria-expanded="false">Acciones</button>
        <div class="action-wheel" role="menu">
          <button class="wheel-action" style="--x:-82px;--y:-45px" type="button" data-action="draw">Robar ♦</button>
          <button class="wheel-action primary" style="--x:0px;--y:-51px" type="button" data-action="attack-mode">Atacar</button>
          <button class="wheel-action primary attack-confirm-action" style="--x:89px;--y:-51px" type="button" data-action="confirm">Confirmar</button>
          <button class="wheel-action" style="--x:100px;--y:-8px" type="button" data-action="modify">MODIFICAR</button>
          <button class="wheel-action" style="--x:76px;--y:36px" type="button" data-action="projectile">Proyectil</button>
          <button class="wheel-action" style="--x:0px;--y:47px" type="button" data-action="pass">Pasar</button>
          <button class="wheel-action defense" style="--x:-94px;--y:30px" type="button" data-action="defend">Defender</button>
          <button class="wheel-action defense" style="--x:-112px;--y:-8px" type="button" data-action="skip-defense">No Def.</button>

    </section>

    <div class="toast" data-toast></div>
  </main>

  <script>
    const CARD_ASSET_ROOT = "../assets/cards/hayeah-full/";
    const SAVE_KEY = "pocobot.sprite.compact.functional.v1";
    const MAX_HAND_SIZE = 7;
    const MECHA_IMAGES = {
      base: "../assets/image_10.png",
      piloto: "../assets/image_11.png",
      copiloto: "../assets/image_12.png",
      ataque: "../assets/image_13.png",
      defensa: "../assets/image_14.png",
      armadura: "../assets/image_15.png",
      combustible: "../assets/image_16.png",
      booster: "../assets/image_17.png",
      completo: "../assets/image_18.png",
      piloto_completo: "../assets/image_19.png",
      piloto_ataque: "../assets/image_20.png",
      piloto_defensa: "../assets/image_21.png",
      piloto_armadura: "../assets/image_22.png",
      piloto_combustible: "../assets/image_23.png",
      piloto_booster: "../assets/image_24.png",
      base_ataque: "../assets/image_25.png",
      base_defensa: "../assets/image_26.png",
      base_armadura: "../assets/image_27.png",
      base_combustible: "../assets/image_28.png",
      base_booster: "../assets/image_29.png"
    };
    const MODULES = ["attack", "defense", "armor"];
    const SUIT_TO_MODULE = { spades: "attack", hearts: "defense", clubs: "armor" };
    const MODULE_LABELS = {
      pilot: "Piloto",
      copilot: "Copiloto",
      booster: "As",
      attack: "Ataque",
      defense: "Defensa",
      armor: "Armadura",
      fuel: "Fuel"
    };
    const SUIT_LABELS = {
      spades: "♠",
      hearts: "♥",
      clubs: "♣",
      diamonds: "♦"
    };
    const RANK_VALUES = { A: 14, K: 13, Q: 12, J: 11, "10": 10, "9": 9, "8": 8, "7": 7, "6": 6, "5": 5, "4": 4, "3": 3, "2": 2 };
    const RANK_FILE = { A: "ace", K: "king", Q: "queen", J: "jack", "10": "10", "9": "9", "8": "8", "7": "7", "6": "6", "5": "5", "4": "4", "3": "3", "2": "2" };

    const shell = document.querySelector(".phone-shell");
    const toastNode = document.querySelector("[data-toast]");
    const fxLayer = document.querySelector("[data-fx-layer]");
    const attackLayer = document.querySelector("[data-attack-layer]");
    const attackLabel = document.querySelector("[data-attack-label]");
    const attackSpecialOverlay = document.querySelector("[data-attack-special-overlay]");
    const attackSpecialVideo = document.querySelector("[data-attack-special-video]");
    const audio = new Audio("../assets/audio_menu_cyberpunk_city.mp3");
    audio.loop = true;
    audio.volume = 0.22;

    let draggedCardId = null;
    let toastTimer = null;
    let rivalTimer = null;
    let attackFxTimer = null;
    let attackVideoTimer = null;
    let attackReadyCueKey = "";
    let handShiftTimer = null;

    const state = {
      gameStarted: false,
      deck: [],
      discard: [],
      removed: [],
      currentPlayer: 0,
      internalTurn: 1,
      phase: "Montaje",
      selected: [],
      attackMode: false,
      projectileMode: false,
      projectileUnlocked: false,
      tutorial: false,
      musicOn: false,
      pendingDefense: null,
      pendingBuildOps: 0,
      winner: null,
      activeTab: "mecha",
      handOffset: 0,
      log: [],
      players: []
    };

    function makeCard(rank, suit, idSuffix = "") {
      return {
        id: `${rank}-${suit}-${idSuffix || Math.random().toString(36).slice(2, 8)}`,
        rank,
        suit,
        value: RANK_VALUES[rank],
        zone: "hand"
      };
    }

    function createDeck() {
      const suits = ["spades", "hearts", "clubs", "diamonds"];
      const ranks = ["A", "K", "Q", "J", "10", "9", "8", "7", "6", "5", "4", "3", "2"];
      const deck = [];
      suits.forEach((suit) => ranks.forEach((rank) => deck.push(makeCard(rank, suit, `${deck.length}`))));
      for (let i = deck.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    function createPlayer(name) {
      return {
        name,
        core: { pilot: null, copilot: null, booster: null },
        attack: [],
        defense: [],
        armor: [],
        fuel: [],
        hand: [],
        flags: {}
      };
    }

    function cloneForSave() {
      return JSON.stringify({
        deck: state.deck,
        discard: state.discard,
        removed: state.removed,
        currentPlayer: state.currentPlayer,
        internalTurn: state.internalTurn,
        phase: state.phase,
        projectileUnlocked: state.projectileUnlocked,
        tutorial: state.tutorial,
        handOffset: state.handOffset,
        players: state.players,
        log: state.log.slice(-40)
      });
    }

    function loadFromSave(raw) {
      const data = JSON.parse(raw);
      Object.assign(state, {
        deck: data.deck || [],
        discard: data.discard || [],
        removed: data.removed || [],
        currentPlayer: data.currentPlayer || 0,
        internalTurn: data.internalTurn || 1,
        phase: data.phase || "Montaje",
        selected: [],
        attackMode: false,
        projectileMode: false,
        projectileUnlocked: !!data.projectileUnlocked,
        tutorial: data.tutorial === true,
        pendingDefense: null,
        pendingBuildOps: 0,
        winner: null,
        handOffset: Number.isInteger(data.handOffset) ? data.handOffset : 0,
        players: data.players || [],
        log: data.log || []
      });
      state.gameStarted = true;
    }

    function takeFromDeck(predicate) {
      const index = state.deck.findIndex(predicate);
      if (index >= 0) return state.deck.splice(index, 1)[0];
      return state.deck.pop() || null;
    }

    function addOpeningCard(player, predicate) {
      const card = takeFromDeck(predicate);
      if (!card) return;
      card.zone = "hand";
      player.hand.push(card);
    }

    function dealOpeningHand(player, pilotSuit = "spades") {
      addOpeningCard(player, (card) => isFigure(card) && card.suit === pilotSuit);
      addOpeningCard(player, (card) => isFigure(card) && card.suit !== "diamonds");
      addOpeningCard(player, (card) => isAce(card));
      addOpeningCard(player, (card) => isNumeric(card) && card.suit === pilotSuit);
      addOpeningCard(player, (card) => isNumeric(card) && card.suit === "hearts");
      addOpeningCard(player, (card) => isNumeric(card) && card.suit === "clubs");
      addOpeningCard(player, (card) => isNumericDiamond(card));
      while (player.hand.length < MAX_HAND_SIZE && state.deck.length) drawCard(player, false);
    }

    function seedDemoGame() {
      window.clearTimeout(rivalTimer);
      Object.assign(state, {
        gameStarted: true,
        deck: createDeck(),
        discard: [],
        removed: [],
        currentPlayer: 0,
        internalTurn: 1,
        phase: "Montaje",
        selected: [],
        attackMode: false,
        projectileMode: false,
        projectileUnlocked: false,
        tutorial: false,
        pendingDefense: null,
        pendingBuildOps: 0,
        winner: null,
        handOffset: 0,
        log: [],
        players: [createPlayer("Jugador 1"), createPlayer("Rival")]
      });

      const p1 = state.players[0];
      const p2 = state.players[1];

      dealOpeningHand(p1, "spades");
      dealOpeningHand(p2, "hearts");

      log("Nueva partida real iniciada: mazo, manos, montaje, ataque y defensa activos.");
      toast("Nueva partida lista");
      render();
    }

    function markZone(card, zone) {
      card.zone = zone;
      return card;
    }

    function cardText(card) {
      return `${card.rank}${SUIT_LABELS[card.suit]}`;
    }

    function cardAsset(card) {
      return `${CARD_ASSET_ROOT}${RANK_FILE[card.rank]}_of_${card.suit}.svg`;
    }

    function isFigure(card) {
      return ["J", "Q", "K"].includes(card.rank);
    }

    function isAce(card) {
      return card.rank === "A";
    }

    function isNumeric(card) {
      return !isFigure(card) && !isAce(card);
    }

    function isNumericDiamond(card) {
      return card && card.suit === "diamonds" && isNumeric(card);
    }

    function isPlayableAttack(card) {
      return card && card.suit === "spades" && isNumeric(card);
    }

    function sum(cards) {
      return cards.reduce((total, card) => total + card.value, 0);
    }

    function getStats(player) {
      const attack = sum(player.attack);
      const defense = sum(player.defense);
      const armor = sum(player.armor);
      const vital = defense + armor;
      const max = Math.max(vital, player.flags.vitalMax || 1, 1);
      player.flags.vitalMax = max;
      return { attack, defense, armor, vital, max };
    }

    function coreCount(player) {
      return [player.core.pilot, player.core.copilot, player.core.booster].filter(Boolean).length;
    }

    function moduleLimit(player, module) {
      let limit = 2;
      if (player.core.pilot && SUIT_TO_MODULE[player.core.pilot.suit] === module) limit = Math.max(limit, 3);
      if (player.core.copilot && player.core.copilot.suit !== "diamonds" && SUIT_TO_MODULE[player.core.copilot.suit] === module) limit = Math.max(limit, 3);
      if (player.core.booster && player.core.booster.suit !== "diamonds" && SUIT_TO_MODULE[player.core.booster.suit] === module) limit = Math.max(limit, 4);
      return limit;
    }

    function playerCanAttack(player) {
      if (!player.core.pilot || player.core.pilot.suit === "diamonds") return false;
      const statsCards = [...player.attack, ...player.defense, ...player.armor];
      const pilotSuitCount = statsCards.filter((card) => card.suit === player.core.pilot.suit).length;
      return statsCards.length >= 3 && player.attack.length > 0 && player.defense.length > 0 && player.armor.length > 0 && pilotSuitCount >= 1;
    }

    function log(text) {
      state.log.unshift(text);
      state.log = state.log.slice(0, 60);
    }

    function toast(text) {
      window.clearTimeout(toastTimer);
      toastNode.textContent = text;
      toastNode.classList.add("show");
      toastTimer = window.setTimeout(() => toastNode.classList.remove("show"), 1800);
    }

    function prefersReducedMotion() {
      try {
        return !!window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      } catch (_error) {
        return false;
      }
    }

    function fighterNode(index) {
      return document.querySelector(index === 0 ? ".fighter-blue" : ".fighter-red");
    }

    function mechaNode(index) {
      return document.querySelector(`[data-mecha-img="${index}"]`);
    }

    function pulseClass(node, className, duration = 800) {
      if (!node) return;
      node.classList.remove(className);
      void node.offsetWidth;
      node.classList.add(className);
      window.setTimeout(() => node.classList.remove(className), duration);
    }

    function spawnSparksFromElement(element, tone = "amber", count = 18) {
      if (!fxLayer || !element || prefersReducedMotion()) return;
      const rect = element.getBoundingClientRect();
      const host = shell.getBoundingClientRect();
      const x = rect.left + rect.width / 2 - host.left;
      const y = rect.top + rect.height / 2 - host.top;
      const palette = {
        amber: "#fff1a8",
        green: "#85ffad",
        cyan: "#77f3ff",
        red: "#ff7a58"
      };
      for (let i = 0; i < count; i += 1) {
        const spark = document.createElement("span");
        spark.className = "fx-spark";
        const angle = (Math.PI * 2 * i / count) + (Math.random() * .45);
        const distance = 28 + Math.random() * 54;
        spark.style.setProperty("--x", `${x}px`);
        spark.style.setProperty("--y", `${y}px`);
        spark.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        spark.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
        spark.style.setProperty("--size", `${4 + Math.random() * 5}px`);
        spark.style.setProperty("--dur", `${.48 + Math.random() * .34}s`);
        spark.style.setProperty("--spark-color", palette[tone] || palette.amber);
        fxLayer.appendChild(spark);
        spark.addEventListener("animationend", () => spark.remove(), { once: true });
      }
    }

    function showDamagePop(value, defenderIndex = 1, label = "") {
      if (!fxLayer || prefersReducedMotion()) return;
      const target = mechaNode(defenderIndex) || fighterNode(defenderIndex);
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const host = shell.getBoundingClientRect();
      const pop = document.createElement("div");
      pop.className = "damage-pop";
      pop.textContent = label || `-${value}`;
      pop.style.left = `${rect.left + rect.width * .56 - host.left}px`;
      pop.style.top = `${rect.top + rect.height * .28 - host.top}px`;
      fxLayer.appendChild(pop);
      pop.addEventListener("animationend", () => pop.remove(), { once: true });
    }

    function positionAttackSpecialPopup(attackerIndex) {
      if (!attackSpecialOverlay) return;
      const target = mechaNode(attackerIndex) || fighterNode(attackerIndex);
      const host = shell.getBoundingClientRect();
      let left = host.width / 2;
      let top = host.height * .34;
      if (target) {
        const rect = target.getBoundingClientRect();
        left = rect.left + rect.width * (attackerIndex === 0 ? .62 : .38) - host.left;
        top = rect.top + rect.height * .34 - host.top;
      }
      left = Math.max(100, Math.min(left, host.width - 100));
      top = Math.max(110, Math.min(top, host.height - 230));
      attackSpecialOverlay.style.left = `${left}px`;
      attackSpecialOverlay.style.top = `${top}px`;
    }

    function hideAttackSpecialPopup() {
      window.clearTimeout(attackVideoTimer);
      attackVideoTimer = null;
      attackSpecialOverlay?.classList.remove("show");
      attackSpecialOverlay?.setAttribute("aria-hidden", "true");
      if (attackSpecialVideo) {
        attackSpecialVideo.pause();
        try { attackSpecialVideo.currentTime = 0; } catch (_error) {}
      }
    }

    function playAttackSpecialVideo() {
      if (!attackSpecialVideo) return;
      attackSpecialVideo.muted = true;
      attackSpecialVideo.defaultMuted = true;
      attackSpecialVideo.playsInline = true;
      attackSpecialVideo.setAttribute("muted", "");
      attackSpecialVideo.setAttribute("playsinline", "");
      try {
        if (attackSpecialVideo.readyState < 2) attackSpecialVideo.load();
      } catch (_error) {}
      const playAttempt = attackSpecialVideo.play();
      if (playAttempt && typeof playAttempt.catch === "function") playAttempt.catch(() => {});
    }

    function showAttackSpecialPopup(attackerIndex = 0, onFinish) {
      if (prefersReducedMotion() || !attackSpecialOverlay || !attackSpecialVideo) {
        onFinish?.();
        return;
      }
      hideAttackSpecialPopup();
      positionAttackSpecialPopup(attackerIndex);
      attackSpecialOverlay.classList.add("show");
      attackSpecialOverlay.setAttribute("aria-hidden", "false");
      spawnSparksFromElement(fighterNode(attackerIndex), "amber", 24);
      playAttackSpecialVideo();
      attackVideoTimer = window.setTimeout(() => {
        hideAttackSpecialPopup();
        onFinish?.();
      }, 2300);
    }

    function isCompleteAttackMecha(player) {
      const image = getMechaPhaseImage(player);
      return image === MECHA_IMAGES.completo || image === MECHA_IMAGES.piloto_completo;
    }

    function runCompactAttackFx({ attackerIndex = 0, damage = 0, projectile = false } = {}) {
      const defenderIndex = attackerIndex === 0 ? 1 : 0;
      const attacker = fighterNode(attackerIndex);
      const defender = fighterNode(defenderIndex);
      if (!attackLayer || !attackLabel) return;
      window.clearTimeout(attackFxTimer);
      attackLabel.textContent = projectile ? "Proyectil" : "Ataque";
      attackLayer.classList.remove("active", "from-left", "from-right", "with-projectile");
      void attackLayer.offsetWidth;
      attackLayer.classList.add("active", attackerIndex === 0 ? "from-left" : "from-right");
      if (projectile) attackLayer.classList.add("with-projectile");
      pulseClass(attacker, "attack-launch", 820);
      spawnSparksFromElement(attacker, projectile ? "cyan" : "amber", projectile ? 20 : 14);
      window.setTimeout(() => {
        pulseClass(defender, "attack-hit", 780);
        shell.classList.add("screen-shake");
        showDamagePop(damage, defenderIndex, damage ? `ATQ ${damage}` : "ATQ");
        spawnSparksFromElement(defender, projectile ? "cyan" : "red", projectile ? 22 : 28);
      }, projectile ? 240 : 320);
      attackFxTimer = window.setTimeout(() => {
        attackLayer.classList.remove("active", "from-left", "from-right", "with-projectile");
        shell.classList.remove("screen-shake");
      }, 1120);
    }

    function playAttackFx({ attackerIndex = 0, damage = 0, projectile = false, full = false } = {}) {
      if (full) {
        let played = false;
        const playBoard = () => {
          if (played) return;
          played = true;
          runCompactAttackFx({ attackerIndex, damage, projectile });
        };
        showAttackSpecialPopup(attackerIndex, () => window.setTimeout(playBoard, 100));
        window.setTimeout(playBoard, 2500);
        return;
      }
      runCompactAttackFx({ attackerIndex, damage, projectile });
    }

    function animateModification(zone) {
      const zoneNode = document.querySelector(`[data-zone="${zone}"]`);
      const statMap = {
        attack: "[data-p1-attack]",
        defense: "[data-p1-defense]",
        armor: "[data-p1-armor]"
      };
      zoneNode?.classList.remove("zone-modified");
      if (zoneNode) {
        void zoneNode.offsetWidth;
        zoneNode.classList.add("zone-modified");
        window.setTimeout(() => zoneNode.classList.remove("zone-modified"), 900);
      }
      const statNode = statMap[zone] ? document.querySelector(statMap[zone])?.closest("p") : null;
      statNode?.classList.remove("stat-pulse");
      if (statNode) {
        void statNode.offsetWidth;
        statNode.classList.add("stat-pulse");
        window.setTimeout(() => statNode.classList.remove("stat-pulse"), 650);
      }
      spawnSparksFromElement(zoneNode || mechaNode(0), zone === "fuel" ? "amber" : "green", 18);
    }

    function getAttackReadiness() {
      const player = state.players[0];
      if (!player || state.currentPlayer !== 0 || state.pendingDefense || state.winner || !state.attackMode) {
        return { ready: false, full: false, key: "" };
      }
      const selection = getAttackSelection(player);
      const ready = !!selection.fuelCards.length
        && (selection.mainValue > 0 || selection.projectileValue > 0)
        && selection.mainValue <= selection.limit;
      const key = ready ? state.selected.slice().sort().join("|") : "";
      return { ready, full: ready && isCompleteAttackMecha(player), key };
    }

    function syncAttackReadiness() {
      const readiness = getAttackReadiness();
      shell.classList.toggle("attack-selection-ready", readiness.ready);
      if (!readiness.ready) {
        attackReadyCueKey = "";
        return;
      }
      if (readiness.full && readiness.key && attackReadyCueKey !== readiness.key) {
        attackReadyCueKey = readiness.key;
        showAttackSpecialPopup(0);
      }
    }

    function drawCard(player, announce = true) {
      if (!state.deck.length) state.deck = createDeck();
      const card = state.deck.pop();
      if (!card) return null;
      card.zone = "hand";
      if (player.hand.length >= MAX_HAND_SIZE) {
        state.discard.push(card);
        if (announce) log(`${player.name} roba ${cardText(card)}, pero la mano esta llena y va al descarte.`);
      } else {
        player.hand.push(card);
        if (announce) log(`${player.name} roba ${cardText(card)}.`);
      }
      return card;
    }

    function findCard(cardId) {
      for (const [playerIndex, player] of state.players.entries()) {
        for (const zone of ["hand", "attack", "defense", "armor", "fuel"]) {
          const card = player[zone].find((item) => item.id === cardId);
          if (card) return { card, player, playerIndex, zone };
        }
        for (const slot of ["pilot", "copilot", "booster"]) {
          const card = player.core[slot];
          if (card && card.id === cardId) return { card, player, playerIndex, zone: slot };
        }
      }
      return null;
    }

    function removeCard(player, zone, id) {
      if (zone in player.core) {
        const card = player.core[zone];
        if (card && card.id === id) {
          player.core[zone] = null;
          return card;
        }
        return null;
      }
      const list = player[zone];
      const index = list.findIndex((card) => card.id === id);
      if (index < 0) return null;
      return list.splice(index, 1)[0];
    }

    function validatePlacement(player, card, zone) {
      if (zone === "pilot") {
        if (!isFigure(card) || card.suit === "diamonds") return "El piloto debe ser J, Q o K y no puede ser ♦.";
        if (player.core.pilot) return "El piloto ya esta ocupado.";
        return "";
      }
      if (zone === "copilot") {
        if (!isFigure(card)) return "El copiloto debe ser J, Q o K.";
        if (player.core.copilot) return "El copiloto ya esta ocupado.";
        return "";
      }
      if (zone === "booster") {
        if (!isAce(card)) return "El potenciador debe ser un As.";
        if (player.core.booster) return "El As ya esta ocupado.";
        return "";
      }
      if (zone === "fuel") {
        if (!isNumericDiamond(card)) return "Fuel solo acepta diamantes numericos.";
        return "";
      }
      if (MODULES.includes(zone)) {
        if (!isNumeric(card) || SUIT_TO_MODULE[card.suit] !== zone) return `${MODULE_LABELS[zone]} no acepta ${cardText(card)}.`;
        if (player[zone].length >= moduleLimit(player, zone)) return `${MODULE_LABELS[zone]} esta lleno.`;
        return "";
      }
      return "Zona no valida.";
    }

    function legalZonesForCard(player, card) {
      return ["pilot", "copilot", "booster", "fuel", "attack", "defense", "armor"]
        .filter((zone) => !validatePlacement(player, card, zone));
    }

    function buildOpsLimit() {
      return state.internalTurn === 1 ? 3 : 2;
    }

    function buildOpsRemaining() {
      return Math.max(0, buildOpsLimit() - state.pendingBuildOps);
    }

    function chooseAutoPlacementZone(player, card) {
      const zones = legalZonesForCard(player, card);
      if (!zones.length) return "";
      const preferred = isFigure(card)
        ? ["pilot", "copilot"]
        : isAce(card)
          ? ["booster"]
          : card.suit === "diamonds"
            ? ["fuel"]
            : [SUIT_TO_MODULE[card.suit]];
      return preferred.find((zone) => zones.includes(zone)) || zones[0];
    }

    function selectedHandCardsForPlayer(player) {
      return state.selected
        .map((id) => findCard(id))
        .filter((item) => item && item.player === player && item.zone === "hand");
    }

    function placeCardDirect(player, card, zone) {
      removeCard(player, "hand", card.id);
      markZone(card, zone);
      if (zone in player.core) player.core[zone] = card;
      else player[zone].push(card);
      return true;
    }

    function rollbackPlacedCards(player, placed) {
      placed.reverse().forEach(({ card, zone }) => {
        const removed = removeCard(player, zone, card.id);
        if (!removed) return;
        markZone(removed, "hand");
        player.hand.push(removed);
      });
    }

    function modifySelectedCards() {
      if (state.pendingDefense || state.winner) return false;
      const player = state.players[0];
      const handCards = selectedHandCardsForPlayer(player);
      const selectedCount = state.selected.length;
      if (!selectedCount) {
        openBoard("mecha");
        return true;
      }
      const remainingOps = buildOpsRemaining();
      if (selectedCount > remainingOps) {
        toast(`Maximo ${buildOpsLimit()} operaciones de modificacion en este turno.`);
        return false;
      }
      if (handCards.length !== selectedCount) {
        toast("MODIFICAR solo coloca cartas seleccionadas de la mano.");
        return false;
      }

      const ordered = [...handCards].sort((a, b) => {
        const rank = (item) => isFigure(item.card) ? 0 : isAce(item.card) ? 1 : item.card.suit === "diamonds" ? 3 : 2;
        return rank(a) - rank(b);
      });
      const placed = [];
      for (const { card } of ordered) {
        const zone = chooseAutoPlacementZone(player, card);
        if (!zone) {
          rollbackPlacedCards(player, placed);
          toast(`No hay hueco legal para ${cardText(card)}.`);
          state.selected = [];
          render();
          return false;
        }
        placeCardDirect(player, card, zone);
        placed.push({ card, zone });
        flashZone(zone, true);
      }

      log(`${player.name} modifica el mecha: ${placed.map(({ card, zone }) => `${cardText(card)} a ${MODULE_LABELS[zone]}`).join(", ")}.`);
      state.selected = [];
      state.pendingBuildOps = 0;
      state.attackMode = false;
      state.projectileMode = false;
      state.activeTab = "mecha";
      shell.classList.add("board-open");
      finishPlayerTurn("modify");
      placed.forEach(({ zone }, index) => {
        window.setTimeout(() => animateModification(zone), 80 + index * 120);
      });
      return true;
    }

    function placeCard(cardId, zone) {
      const found = findCard(cardId);
      const player = state.players[0];
      if (!found || found.player !== player || found.zone !== "hand") {
        toast("Solo puedes montar cartas desde tu mano.");
        return false;
      }
      if (state.pendingBuildOps >= buildOpsLimit()) {
        toast(`Maximo ${buildOpsLimit()} operaciones de modificacion en este turno.`);
        return false;
      }
      const error = validatePlacement(player, found.card, zone);
      if (error) {
        toast(error);
        flashZone(zone, false);
        return false;
      }
      const card = removeCard(player, "hand", found.card.id);
      markZone(card, zone);
      if (zone in player.core) player.core[zone] = card;
      else player[zone].push(card);
      state.pendingBuildOps += 1;
      log(`Montaje: ${cardText(card)} colocado en ${MODULE_LABELS[zone]}.`);
      render();
      flashZone(zone, true);
      animateModification(zone);
      return true;
    }

    function flashZone(zone, valid) {
      const node = document.querySelector(`[data-zone="${zone}"]`);
      if (!node) return;
      node.classList.remove("is-active", "is-invalid");
      node.classList.add(valid ? "is-active" : "is-invalid");
      window.setTimeout(() => node.classList.remove("is-active", "is-invalid"), 480);
    }

    function clearDropHints() {
      document.querySelectorAll(".drop-zone").forEach((node) => {
        node.classList.remove("is-drop-valid", "is-drop-invalid", "is-drop-hover");
      });
    }

    function canHintBuildTargets(found) {
      return found
        && found.player === state.players[0]
        && found.zone === "hand"
        && state.currentPlayer === 0
        && state.pendingBuildOps < buildOpsLimit()
        && !state.pendingDefense
        && !state.winner;
    }

    function updateDropHints(cardId) {
      clearDropHints();
      const found = findCard(cardId);
      if (!canHintBuildTargets(found)) return false;
      state.activeTab = "mecha";
      shell.classList.add("board-open");
      renderActions();
      document.querySelectorAll(".drop-zone").forEach((node) => {
        if (node.dataset.zone === "reg") return;
        const isValid = !validatePlacement(state.players[0], found.card, node.dataset.zone);
        node.classList.toggle("is-drop-valid", isValid);
        node.classList.toggle("is-drop-invalid", !isValid);
      });
      return true;
    }

    function updateDropHover(zone) {
      document.querySelectorAll(".drop-zone.is-drop-hover").forEach((node) => {
        node.classList.remove("is-drop-hover");
      });
      if (zone && zone.classList.contains("is-drop-valid")) zone.classList.add("is-drop-hover");
    }

    function applyBuildChanges() {
      if (!state.pendingBuildOps) {
        toast("Arrastra primero una carta al panel.");
        return;
      }
      log(`${state.players[0].name} confirma ${state.pendingBuildOps} cambio(s) de montaje.`);
      state.pendingBuildOps = 0;
      state.attackMode = false;
      state.projectileMode = false;
      state.selected = [];
      shell.classList.remove("board-open");
      finishPlayerTurn("modify");
    }

    function syncActionFlyouts() {
      shell.classList.toggle(
        "attack-confirm-open",
        shell.classList.contains("actions-open") && state.attackMode && state.currentPlayer === 0 && !state.pendingDefense && !state.winner
      );
    }

    function openActions() {
      shell.classList.toggle("actions-open");
      document.querySelector("[data-action-toggle]")?.setAttribute("aria-expanded", shell.classList.contains("actions-open") ? "true" : "false");
      syncActionFlyouts();
    }

    function openBoard(tab = "mecha") {
      state.activeTab = tab;
      shell.classList.add("board-open");
      render();
    }

    function closeBoard() {
      shell.classList.remove("board-open");
    }

    function closeActions() {
      shell.classList.remove("actions-open", "attack-confirm-open");
      document.querySelector("[data-action-toggle]")?.setAttribute("aria-expanded", "false");
    }

    function toggleSelected(cardId) {
      const found = findCard(cardId);
      if (!found) return;
      if (state.pendingDefense) {
        if (found.playerIndex !== state.pendingDefense.defenderIndex || !isNumericDiamond(found.card)) {
          toast("La defensa solo acepta 1 diamante numerico de la mano.");
          return;
        }
        state.selected = [cardId];
        render();
        return;
      }
      const currentPlayer = state.players[state.currentPlayer];
      if (found.player !== currentPlayer) return;
      if (state.attackMode && !["fuel", "attack", "armor"].includes(found.zone)) {
        toast("Para atacar selecciona fuel, ataque o armadura con As♦.");
        return;
      }
      if (state.attackMode && found.zone === "armor" && currentPlayer.core.booster?.suit !== "diamonds") {
        toast("La armadura solo cuenta como fuel con As♦.");
        return;
      }
      if (state.selected.includes(cardId)) state.selected = state.selected.filter((id) => id !== cardId);
      else state.selected.push(cardId);
      render();
    }

    function clearSelection() {
      state.selected = [];
      state.attackMode = false;
      state.projectileMode = false;
      render();
    }

    function drawWithDiamond() {
      const player = state.players[0];
      const selectedCards = state.selected.map((id) => findCard(id)?.card).filter(Boolean);
      const card = selectedCards.find((item) => item.zone === "hand" && isNumericDiamond(item));
      if (!card) {
        toast("Selecciona 1 diamante numerico de tu mano.");
        return;
      }
      removeCard(player, "hand", card.id);
      state.discard.push(card);
      const drawCount = Math.min(card.value, 4);
      for (let i = 0; i < drawCount; i += 1) drawCard(player);
      state.selected = [];
      log(`${player.name} descarta ${cardText(card)} y roba ${drawCount} carta(s).`);
      finishPlayerTurn("draw");
    }

    function passTurn() {
      if (state.pendingDefense) {
        skipDefense();
        return;
      }
      const player = state.players[0];
      const selectedHand = state.selected.map((id) => findCard(id)).filter((item) => item && item.player === player && item.zone === "hand");
      const required = Math.min(2, player.hand.length);
      if (selectedHand.length !== required) {
        toast(`Para pasar selecciona ${required} carta(s) de la mano.`);
        return;
      }
      selectedHand.forEach(({ card }) => {
        removeCard(player, "hand", card.id);
        state.discard.push(card);
      });
      log(`${player.name} pasa y descarta ${required} carta(s).`);
      finishPlayerTurn("pass");
    }

    function startAttackMode() {
      const player = state.players[0];
      if (!playerCanAttack(player)) {
        toast("El mecha aun no cumple los requisitos de ataque.");
        return;
      }
      state.attackMode = true;
      state.projectileMode = false;
      state.selected = [];
      openBoard("mecha");
      toast("Selecciona fuel y cartas de ataque.");
      render();
    }

    function toggleProjectileMode() {
      if (!state.projectileUnlocked) {
        toast("El proyectil se desbloquea tras el primer ataque.");
        return;
      }
      state.projectileMode = !state.projectileMode;
      state.attackMode = true;
      openBoard("mecha");
      render();
    }

    function getAttackSelection(player) {
      const selected = state.selected.map((id) => findCard(id)).filter((item) => item && item.player === player);
      const fuel = selected.filter((item) => item.zone === "fuel").map((item) => item.card);
      const armorFuel = player.core.booster?.suit === "diamonds"
        ? selected.filter((item) => item.zone === "armor").map((item) => item.card)
        : [];
      const attackCards = selected.filter((item) => item.zone === "attack" && isPlayableAttack(item.card)).map((item) => item.card);
      const projectile = state.projectileMode ? attackCards[attackCards.length - 1] : null;
      const mainAttackCards = projectile ? attackCards.slice(0, -1) : attackCards;
      const fuelCards = [...fuel, ...armorFuel];
      return {
        fuel,
        armorFuel,
        fuelCards,
        fuelValue: sum(fuelCards),
        limit: sum(fuelCards) * 2,
        mainAttackCards,
        mainValue: sum(mainAttackCards),
        projectile,
        projectileValue: projectile ? projectile.value : 0
      };
    }

    function confirmAttack(projectileOnly = false) {
      const attacker = state.players[state.currentPlayer];
      if (state.currentPlayer !== 0) return;
      if (!state.attackMode && !projectileOnly) {
        startAttackMode();
        return;
      }
      const selection = getAttackSelection(attacker);
      let total = 0;
      let projectile = selection.projectile;

      if (projectileOnly) {
        const selected = state.selected.map((id) => findCard(id)).filter((item) => item && item.player === attacker && item.zone === "attack" && isPlayableAttack(item.card));
        if (selected.length !== 1) {
          toast("Selecciona 1 carta de picas para proyectil.");
          return;
        }
        projectile = selected[0].card;
        total = projectile.value;
      } else {
        if (!selection.fuelCards.length) {
          toast("Selecciona fuel. Con As♦ tambien vale armadura.");
          return;
        }
        if (!selection.mainValue && !projectile) {
          toast("Selecciona al menos una carta de ataque.");
          return;
        }
        if (selection.mainValue > selection.limit) {
          toast(`Ataque ${selection.mainValue}, fuel solo permite ${selection.limit}.`);
          return;
        }
        total = selection.mainValue + selection.projectileValue;
        selection.fuel.forEach((card) => {
          removeCard(attacker, "fuel", card.id);
          state.discard.push(card);
        });
        selection.armorFuel.forEach((card) => {
          removeCard(attacker, "armor", card.id);
          state.discard.push(card);
        });
      }

      if (projectile) {
        removeCard(attacker, "attack", projectile.id);
        state.discard.push(projectile);
      }

      if (!state.projectileUnlocked) state.projectileUnlocked = true;
      state.attackMode = false;
      state.projectileMode = false;
      state.selected = [];
      log(`${attacker.name} declara ataque de ${total} punto(s).`);
      shell.classList.add("attack-flash");
      window.setTimeout(() => shell.classList.remove("attack-flash"), 600);
      playAttackFx({
        attackerIndex: state.currentPlayer,
        damage: total,
        projectile: !!projectile,
        full: !projectileOnly && isCompleteAttackMecha(attacker)
      });
      beginDefenseWindow(total, !!projectile);
    }

    function beginDefenseWindow(totalAttack, withProjectile) {
      const defenderIndex = 1 - state.currentPlayer;
      const defender = state.players[defenderIndex];
      const diamonds = defender.hand.filter(isNumericDiamond);
      state.pendingDefense = {
        attackerIndex: state.currentPlayer,
        defenderIndex,
        totalAttack,
        withProjectile
      };
      state.phase = "Defensa activa";
      shell.classList.remove("board-open");
      if (!diamonds.length) {
        log(`${defender.name} no tiene diamantes para defenderse.`);
        resolveAttackAfterDefense(0);
        return;
      } else {
        log(`${defender.name} puede defenderse con 1 diamante.`);
      }
      render();
      if (defenderIndex === 1) {
        rivalTimer = window.setTimeout(cpuResolveDefense, diamonds.length ? 900 : 620);
      }
    }

    function cpuResolveDefense() {
      if (!state.pendingDefense || state.pendingDefense.defenderIndex !== 1) return;
      const defender = state.players[1];
      const diamonds = defender.hand.filter(isNumericDiamond).sort((a, b) => a.value - b.value);
      if (!diamonds.length) {
        skipDefense();
        return;
      }
      const target = state.pendingDefense.totalAttack;
      const efficient = diamonds.find((card) => card.value >= Math.min(target, 6)) || diamonds[diamonds.length - 1];
      state.selected = [efficient.id];
      log(`CPU prepara ${cardText(efficient)} para defenderse.`);
      confirmDefense();
    }

    function confirmDefense() {
      if (!state.pendingDefense) return;
      const defender = state.players[state.pendingDefense.defenderIndex];
      let defenseCard = state.selected.map((id) => findCard(id)).find((item) => item && item.player === defender && item.zone === "hand" && isNumericDiamond(item.card))?.card;
      if (!defenseCard) defenseCard = defender.hand.find(isNumericDiamond);
      if (!defenseCard) {
        skipDefense();
        return;
      }
      removeCard(defender, "hand", defenseCard.id);
      state.discard.push(defenseCard);
      log(`${defender.name} usa ${cardText(defenseCard)} y reduce ${defenseCard.value}.`);
      resolveAttackAfterDefense(defenseCard.value);
    }

    function skipDefense() {
      if (!state.pendingDefense) return;
      log(`${state.players[state.pendingDefense.defenderIndex].name} no se defiende.`);
      resolveAttackAfterDefense(0);
    }

    function resolveAttackAfterDefense(reduction) {
      const pending = state.pendingDefense;
      if (!pending) return;
      const total = Math.max(0, pending.totalAttack - reduction);
      const result = applyAttack(pending.defenderIndex, total);
      state.pendingDefense = null;
      state.selected = [];
      state.phase = "Ataque resuelto";
      log(result);
      shell.classList.add("shake");
      window.setTimeout(() => shell.classList.remove("shake"), 420);
      if (total > 0) {
        showDamagePop(total, pending.defenderIndex);
        spawnSparksFromElement(fighterNode(pending.defenderIndex), "red", total >= 8 ? 30 : 18);
      }
      checkWinner();
      if (state.winner) {
        render();
        return;
      }
      if (pending.attackerIndex === 0) {
        finishPlayerTurn("attack");
      } else {
        startPlayerTurn();
      }
    }

    function applyAttack(defenderIndex, attackPoints) {
      const defender = state.players[defenderIndex];
      let remaining = attackPoints;
      const destroyedArmor = [];
      const destroyedDefense = [];
      defender.armor.sort((a, b) => a.value - b.value);
      defender.defense.sort((a, b) => a.value - b.value);
      while (defender.armor.length && remaining > 0) {
        const card = defender.armor[0];
        if (remaining < card.value) break;
        remaining -= card.value;
        destroyedArmor.push(defender.armor.shift());
      }
      while (!defender.armor.length && defender.defense.length && remaining > 0) {
        const card = defender.defense[0];
        if (remaining < card.value) break;
        remaining -= card.value;
        destroyedDefense.push(defender.defense.shift());
      }
      destroyedArmor.forEach((card) => state.discard.push(card));
      destroyedDefense.forEach((card) => state.removed.push(card));
      return `Impacto ${attackPoints}: armadura x${destroyedArmor.length}, defensa x${destroyedDefense.length}.`;
    }

    function checkWinner() {
      state.players.forEach((player, index) => {
        if (!player.defense.length) state.winner = state.players[1 - index].name;
      });
      if (state.winner) {
        state.phase = "Final";
        log(`${state.winner} gana la partida.`);
        toast(`${state.winner} gana`);
      }
    }

    function finishPlayerTurn(reason) {
      state.selected = [];
      state.attackMode = false;
      state.projectileMode = false;
      state.currentPlayer = 1;
      state.internalTurn += 1;
      state.phase = "Turno rival";
      drawCard(state.players[1]);
      render();
      rivalTimer = window.setTimeout(simulateRivalTurn, reason === "attack" ? 900 : 650);
    }

    function startPlayerTurn() {
      state.currentPlayer = 0;
      state.internalTurn += 1;
      state.phase = "Tu turno";
      drawCard(state.players[0]);
      render();
      toast("Tu turno");
    }

    function simulateRivalTurn() {
      if (state.winner || state.pendingDefense) return;
      state.currentPlayer = 1;
      const rival = state.players[1];
      const fuel = [...rival.fuel].sort((a, b) => b.value - a.value)[0];
      const limit = fuel ? fuel.value * 2 : 0;
      const attack = [...rival.attack].filter(isPlayableAttack).sort((a, b) => b.value - a.value).find((card) => card.value <= limit);
      if (fuel && attack && playerCanAttack(rival)) {
        removeCard(rival, "fuel", fuel.id);
        state.discard.push(fuel);
        const total = Math.min(attack.value, limit);
        log(`Rival declara ataque de ${total} punto(s).`);
        playAttackFx({
          attackerIndex: 1,
          damage: total,
          projectile: false,
          full: isCompleteAttackMecha(rival)
        });
        beginDefenseWindow(total, false);
        return;
      }

      const built = cpuBuildBestCards(rival);
      if (built > 0) {
        log(`CPU monta ${built} pieza(s) y cede iniciativa.`);
        startPlayerTurn();
        return;
      }

      const diamond = rival.hand.find(isNumericDiamond);
      if (diamond) {
        removeCard(rival, "hand", diamond.id);
        state.discard.push(diamond);
        const drawCount = Math.min(diamond.value, 4);
        for (let i = 0; i < drawCount; i += 1) drawCard(rival);
        log(`CPU usa ${cardText(diamond)} para robar ${drawCount}.`);
        startPlayerTurn();
        return;
      }

      const discardCount = Math.min(2, rival.hand.length);
      for (let i = 0; i < discardCount; i += 1) {
        const card = rival.hand.shift();
        if (card) state.discard.push(card);
      }
      log(discardCount ? `CPU descarta ${discardCount} carta(s) y pasa.` : "CPU pasa sin cartas.");
      startPlayerTurn();
    }

    function cpuBuildBestCards(player) {
      const priorities = ["pilot", "copilot", "booster", "fuel", "attack", "defense", "armor"];
      let built = 0;
      for (let op = 0; op < 2; op += 1) {
        let best = null;
        for (const card of [...player.hand]) {
          const zones = legalZonesForCard(player, card);
          if (!zones.length) continue;
          const zone = priorities.find((item) => zones.includes(item));
          const score = priorities.indexOf(zone) * 100 - card.value;
          if (!best || score < best.score) best = { card, zone, score };
        }
        if (!best) break;
        placeCardDirect(player, best.card, best.zone);
        built += 1;
      }
      return built;
    }

    function handleMenu(action) {
      if (action === "new") seedDemoGame();
      if (action === "back") {
        shell.classList.remove("actions-open", "board-open");
        state.attackMode = false;
        state.selected = [];
        state.phase = "Menu principal";
        toast("Volver al menu");
        render();
      }
      if (action === "save") {
        localStorage.setItem(SAVE_KEY, cloneForSave());
        toast("Partida guardada");
      }
      if (action === "load") {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) {
          toast("No hay partida guardada");
          return;
        }
        loadFromSave(raw);
        toast("Partida cargada");
        render();
      }
      if (action === "music") {
        state.musicOn = !state.musicOn;
        if (state.musicOn) audio.play().catch(() => toast("Pulsa otra vez para activar audio."));
        else audio.pause();
        render();
      }
      if (action === "tutorial") {
        state.tutorial = !state.tutorial;
        render();
      }
      closeActions();
    }

    function handleAction(action) {
      if (action === "defend") {
        if (!state.pendingDefense || state.pendingDefense.defenderIndex !== 0) {
          toast("No hay defensa activa para ti.");
          return;
        }
        confirmDefense();
        closeActions();
        return;
      }
      if (action === "skip-defense") {
        if (!state.pendingDefense || state.pendingDefense.defenderIndex !== 0) {
          toast("No hay ataque que rechazar.");
          return;
        }
        skipDefense();
        closeActions();
        return;
      }
      if (state.currentPlayer !== 0 && !state.pendingDefense) {
        toast("Espera al rival.");
        return;
      }
      if (action === "modify") {
        modifySelectedCards();
        closeActions();
        return;
      }
      if (action === "draw") drawWithDiamond();
      if (action === "attack-mode") {
        startAttackMode();
        if (state.attackMode) {
          shell.classList.add("actions-open");
          document.querySelector("[data-action-toggle]")?.setAttribute("aria-expanded", "true");
          syncActionFlyouts();
          return;
        }
      }
      if (action === "projectile") toggleProjectileMode();
      if (action === "confirm") confirmAttack(false);
      if (action === "pass") passTurn();
      if (action === "clear") clearSelection();
      closeActions();
    }

    function renderBars(container, count, active) {
      container.innerHTML = "";
      for (let i = 0; i < count; i += 1) {
        const b = document.createElement("b");
        if (i >= active) b.style.opacity = ".25";
        container.appendChild(b);
      }
    }

    function renderStats() {
      const p1 = state.players[0];
      const p2 = state.players[1];
      if (!p1 || !p2) return;
      const s1 = getStats(p1);
      const s2 = getStats(p2);
      document.querySelector("[data-player-name]").textContent = state.currentPlayer === 0 ? "JUGADOR 1" : "EN ESPERA";
      document.querySelector("[data-fuel-value]").textContent = sum(p1.fuel);
      document.querySelector("[data-core-value]").textContent = `${coreCount(p1)}/3`;
      renderBars(document.querySelector("[data-fuel-bars]"), 6, Math.min(6, p1.fuel.length + 1));
