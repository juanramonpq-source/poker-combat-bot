<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CombateFinal</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{
      --bg:#060b13;
      --panel:#101b2d;
      --line:rgba(143,244,255,.24);
      --cyan:#8ff4ff;
      --text:#edf7ff;
      --muted:#b7cadb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      color:var(--text);
      font-family:"Trebuchet MS", Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(143,244,255,.12), transparent 26%),
        linear-gradient(180deg, #05080d, #0a1220 56%, #05080d);
    }
    .card{
      width:min(520px, 100%);
      padding:24px;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg, rgba(16,27,45,.96), rgba(8,15,26,.98));
      box-shadow:0 24px 60px rgba(0,0,0,.34);
    }
    h1{
      margin:0 0 10px;
      font:900 clamp(2rem, 6vw, 3rem)/.92 Impact, "Arial Black", sans-serif;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
    }
    a{
      color:var(--cyan);
      font-weight:800;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CombateFinal</h1>
    <p>Entrando al combate final del coloso. Si no entra automaticamente, abre <a id="fallbackLink" href="poker_combat_bot_ONLINE.html?story_mission=tower_final_colossus&amp;story_embed=1&amp;story_standalone=1&amp;story_node=torre&amp;story_audio=internal&amp;story_brief=off&amp;story_tower_return_scene=control&amp;story_tower_enemy_id=argos-final-colossus&amp;story_return=MODO_HISTORIA_DEVTOOLS.html&amp;v=combate-final-fase-1">este enlace</a>.</p>
  </div>
  <script>
    (function(){
      const url = new URL('poker_combat_bot_ONLINE.html', window.location.href);
      url.searchParams.set('story_mission', 'tower_final_colossus');
      url.searchParams.set('story_embed', '1');
      url.searchParams.set('story_standalone', '1');
      url.searchParams.set('story_node', 'torre');
      url.searchParams.set('story_audio', 'internal');
      url.searchParams.set('story_brief', 'off');
      url.searchParams.set('story_tower_return_scene', 'control');
      url.searchParams.set('story_tower_enemy_id', 'argos-final-colossus');
      url.searchParams.set('story_return', new URL('MODO_HISTORIA_DEVTOOLS.html', window.location.href).href);
      url.searchParams.set('v', 'combate-final-fase-1');
      const fallback = document.getElementById('fallbackLink');
      if(fallback) fallback.href = url.href;
      window.location.replace(url.href);
    })();
  </script>
</body>
</html>
