<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Radio de Xavor Glitch</title>
  <desc id="desc">Radio portátil de frontera con pantalla azul, antena y luces de transmisión.</desc>
  <defs>
