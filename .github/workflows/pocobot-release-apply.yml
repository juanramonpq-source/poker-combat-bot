name: Apply PoCoBOT commercial cover release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocobot-commercial-cover-release
  cancel-in-progress: false

jobs:
  apply-release-delta:
    if: ${{ !contains(github.event.head_commit.message, 'Apply commercial PoCoBOT cover release') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply clean release delta
        env:
          DELTA_URL: https://dccb7994828d51.lhr.life/pocobot-commercial-cover-delta-1779895377.tar.gz
          DELTA_SHA256: a4b32b56a5bac61100f2341b455ce516b2a4c708cd68543233cbd4e5853d99c7
        run: |
          set -euo pipefail
          curl -fsSL "$DELTA_URL" -o /tmp/pocobot-commercial-cover-delta.tar.gz
          echo "$DELTA_SHA256  /tmp/pocobot-commercial-cover-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pocobot-commercial-cover-delta.tar.gz -C .
          rm -f .github/workflows/pocobot-release-apply.yml
          git config user.name "PoCoBOT Release Bot"
          git config user.email "pocobot-release-bot@users.noreply.github.com"
          git add CLEAN_RELEASE.md poker_combat_bot_ONLINE.html scripts/pocobot-clean-manifest.json assets/pocobot_cover_suits_attack_1920x1080.png assets/pocobot_logo_dynamic_transparent.png .github/workflows/pocobot-release-apply.yml
          if git diff --cached --quiet; then
            echo "No release delta changes to commit."
            exit 0
          fi
          git commit -m "Apply commercial PoCoBOT cover release"
          git push origin HEAD:main
